services:
  canopy:
    image: canopy:local
    init: true
    restart: on-failure
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    shm_size: 16m
    # Git executes Canopy's generated update hook in this mount. Do not use noexec.
    tmpfs:
      - /var/lib/canopy:rw,nosuid,nodev,size=2147483648,uid=10001,gid=10001,mode=0700
    volumes:
      - type: bind
        source: ./config.json
        target: /etc/canopy/config.json
        read_only: true
        bind:
          create_host_path: false
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", http://127.0.0.1:8080/readyz]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 2m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

[package]
name = "canopy-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
blake3 = "1.8"
bytes = "1.11"
cellule-app = { git = "https://github.com/crabbuild/cellule.git", rev = "56b35ab376ff93ec85d502c70bb436c918463958" }
cellule-host = { git = "https://github.com/crabbuild/cellule.git", rev = "56b35ab376ff93ec85d502c70bb436c918463958" }
cellule-ltx = { git = "https://github.com/crabbuild/cellule.git", rev = "56b35ab376ff93ec85d502c70bb436c918463958", features = ["replica"] }
cellule-runtime = { git = "https://github.com/crabbuild/cellule.git", rev = "56b35ab376ff93ec85d502c70bb436c918463958" }
cellule-store = { git = "https://github.com/crabbuild/cellule.git", rev = "56b35ab376ff93ec85d502c70bb436c918463958" }
ed25519-dalek = "2"
flate2 = "1.1"
futures-core = "0.3"
hex = "0.4"
http-body = "1"
object_store = "0.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.24", features = ["v4"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.49", features = ["test-util"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

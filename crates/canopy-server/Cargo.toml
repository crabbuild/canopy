[package]
name = "canopy-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
canopy-git-format = { path = "../canopy-git-format" }
canopy-object-storage = { path = "../canopy-object-storage" }
axum = "0.8.9"
base64 = "0.22"
blake3 = "1.8"
bytes = "1.11"
cellule-app = { git = "https://github.com/crabbuild/cellule.git", rev = "0573f48998c4e5343cd8b463d79b7bc1820c923c" }
cellule-host = { git = "https://github.com/crabbuild/cellule.git", rev = "0573f48998c4e5343cd8b463d79b7bc1820c923c" }
cellule-ltx = { git = "https://github.com/crabbuild/cellule.git", rev = "0573f48998c4e5343cd8b463d79b7bc1820c923c", features = ["replica"] }
cellule-runtime = { git = "https://github.com/crabbuild/cellule.git", rev = "0573f48998c4e5343cd8b463d79b7bc1820c923c" }
cellule-store = { git = "https://github.com/crabbuild/cellule.git", rev = "0573f48998c4e5343cd8b463d79b7bc1820c923c" }
ed25519-dalek = "2"
flate2 = "1.1"
futures-core = "0.3"
hex = "0.4"
http-body = "1"
object_store = "0.14.1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ecdsa"] }
tempfile = "3"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "=1.24.0", features = ["v4"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14.10"
tokio-rustls = "0.26.5"
tokio = { version = "1.49", features = ["test-util"] }
async-trait = "0.1"

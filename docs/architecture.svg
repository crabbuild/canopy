<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" role="img" aria-labelledby="title description">
  <title id="title">Canopy request and storage architecture</title>
  <desc id="description">A Git client or browser reaches the Canopy gateway. The gateway resolves accounts and names through the Directory Cell and routes repository work to a Repository Cell. The Repository Cell references immutable object-store bodies. Native Git uses a disposable local cache for wire protocol work.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="980" height="510" rx="18" fill="#f8fafc"/>
  <text x="36" y="45" fill="#0f172a" font-family="system-ui, sans-serif" font-size="24" font-weight="700">From request to durable state</text>
  <text x="36" y="72" fill="#475569" font-family="system-ui, sans-serif" font-size="14">Repository Cells own Git and collaboration state; native Git files are rebuildable.</text>

  <path d="M196 190 H234" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M426 163 C461 163 466 140 508 140" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M426 222 C461 222 467 300 508 300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M715 140 C775 140 865 188 865 248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M715 300 H783" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M331 245 V343" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M510 340 C476 340 470 395 428 395" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" stroke-dashoffset="-3" marker-end="url(#arrow)"/>

  <rect x="36" y="140" width="160" height="100" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="55" y="174" fill="#0f172a" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Git client</text>
  <text x="55" y="197" fill="#334155" font-family="system-ui, sans-serif" font-size="13">or browser</text>
  <text x="55" y="219" fill="#475569" font-family="system-ui, sans-serif" font-size="12">HTTPS / SSH</text>

  <rect x="236" y="135" width="190" height="110" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="254" y="171" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Canopy gateway</text>
  <text x="254" y="194" fill="#1e40af" font-family="system-ui, sans-serif" font-size="13">admission and routing</text>
  <text x="254" y="216" fill="#1e40af" font-family="system-ui, sans-serif" font-size="13">Git / LFS endpoints</text>

  <rect x="510" y="90" width="205" height="100" rx="12" fill="#ccfbf1" stroke="#2dd4bf"/>
  <text x="528" y="125" fill="#115e59" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Directory Cell</text>
  <text x="528" y="149" fill="#134e4a" font-family="system-ui, sans-serif" font-size="13">accounts and names</text>
  <text x="528" y="170" fill="#134e4a" font-family="system-ui, sans-serif" font-size="13">repository UUID lookup</text>

  <rect x="510" y="235" width="205" height="130" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="528" y="270" fill="#4c1d95" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Repository Cell</text>
  <text x="528" y="294" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="13">refs, objects and ACLs</text>
  <text x="528" y="315" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="13">issues, PRs and checks</text>
  <text x="528" y="342" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="12">durable SQLite authority</text>

  <rect x="785" y="250" width="160" height="100" rx="12" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="803" y="286" fill="#78350f" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Object store</text>
  <text x="803" y="310" fill="#92400e" font-family="system-ui, sans-serif" font-size="13">Cell roots; large Git</text>
  <text x="803" y="331" fill="#92400e" font-family="system-ui, sans-serif" font-size="13">and LFS bodies</text>

  <rect x="236" y="345" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="254" y="380" fill="#334155" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Native Git cache</text>
  <text x="254" y="404" fill="#475569" font-family="system-ui, sans-serif" font-size="13">packs and ref snapshots</text>
  <text x="254" y="426" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">disposable local files</text>

  <text x="36" y="482" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Directory, Repository and object-store state is durable. The dashed Git cache is rebuilt after local disk loss.</text>
</svg>

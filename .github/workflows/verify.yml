name: Verify

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python qualification harness
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          rustup component add clippy rustfmt
          sudo apt-get update
          sudo apt-get install -y git-lfs openssh-client
          git lfs install
      - name: Report tool versions
        run: |
          rustc --version --verbose
          cargo --version
          rustup show active-toolchain
          git --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Qualify Git compatibility against RustFS
        run: python3 scripts/qualify_size.py --provider-only
      - name: Build server
        run: cargo build --locked --bin canopy

name: Qualify large Git and LFS transfers

on:
  workflow_dispatch:

jobs:
  large-transfer:
    # Provide a dedicated Linux runner with at least 40 GiB free on both
    # scratch and Docker's data volume. The script checks both before upload.
    runs-on: [self-hosted, linux, x64, canopy-large-transfer]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli git-lfs openssh-client
          git lfs install
      - name: Qualify non-sparse Git and LFS size against RustFS
        run: python3 scripts/qualify_size.py --docker-volume --release

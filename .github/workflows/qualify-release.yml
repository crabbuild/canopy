name: Qualify release correctness against RustFS

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/cellule-release-ci-*'
      - 'codex/three-node-recovery-evidence'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize qualification evidence before tool setup
        run: |
          mkdir qualification
          git rev-parse HEAD > qualification/head.txt
          cp .github/workflows/qualify-release.yml qualification/qualify-release.yml
      - name: Install tools
        run: |
          rustup component add clippy rustfmt
          sudo apt-get update
          sudo apt-get install -y git-lfs openssh-client
          aws --version
          git lfs install
      - name: Bind exact source and dependency inputs
        run: |
          cargo metadata --locked --format-version 1 > qualification/metadata.json
          docker pull rustfs/rustfs:1.0.0-beta.8-glibc
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import tomllib

          metadata = json.loads(Path('qualification/metadata.json').read_text())
          manifest = tomllib.loads(Path('crates/canopy-server/Cargo.toml').read_text())
          revisions = {value['rev'] for value in manifest['dependencies'].values()
                       if isinstance(value, dict) and value.get('git') == 'https://github.com/crabbuild/cellule.git'}
          assert len(revisions) == 1
          revision = revisions.pop()
          packages = {package['name']: package['source'] for package in metadata['packages']
                      if package['name'].startswith('cellule-')}
          assert set(packages) == {'cellule-app', 'cellule-host', 'cellule-ltx',
                                   'cellule-runtime', 'cellule-store', 'cellule-types'}
          assert all(source == f'git+https://github.com/crabbuild/cellule.git?rev={revision}#{revision}'
                     for source in packages.values())
          files = subprocess.check_output(['git', 'ls-files', 'crates', 'scripts', 'Cargo.toml',
                                            'Cargo.lock', '.github/workflows'], text=True).splitlines()
          image = json.loads(subprocess.check_output(['docker', 'image', 'inspect',
                                                      'rustfs/rustfs:1.0.0-beta.8-glibc'], text=True))[0]
          result = {
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'cellule_revision': revision,
              'packages': packages,
              'source_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files},
              'rustc': subprocess.check_output(['rustc', '-Vv'], text=True),
              'cargo': subprocess.check_output(['cargo', '-V'], text=True).strip(),
              'git': subprocess.check_output(['git', '--version'], text=True).strip(),
              'rustfs_image': {'id': image['Id'], 'repo_digests': image.get('RepoDigests', [])},
              'scope': 'Linux release correctness and fresh RustFS compatibility only; '
                       'not native Mac qualification, retained-store upgrade, recovery or reference capacity.',
          }
          Path('qualification/inputs.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          cp Cargo.lock qualification/Cargo.lock
          cp .github/workflows/qualify-release.yml qualification/qualify-release.yml
      - name: Check release formatting and all-target lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --release --workspace --all-targets --locked -- -D warnings 2>&1 | tee qualification/release-clippy.log
      - name: Test release workspace
        run: cargo test --release --workspace --locked -- --test-threads=4 2>&1 | tee qualification/release-workspace.log
      - name: Check Python qualification harness
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee qualification/python-harness.log
      - name: Qualify release Git compatibility against RustFS
        run: python3 scripts/qualify_size.py --provider-only --release 2>&1 | tee qualification/release-rustfs.log
      - name: Build and retain release executable
        run: |
          cargo build --release --locked --bin canopy 2>&1 | tee qualification/release-build.log
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          inputs = json.loads(Path('qualification/inputs.json').read_text())
          assert all(hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest
                     for name, digest in inputs['source_sha256'].items())
          binary = Path('target/release/canopy')
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          result = {'head': inputs['head'], 'cellule_revision': inputs['cellule_revision'],
                    'binary_sha256': digest, 'binary_size_bytes': binary.stat().st_size,
                    'bound_source_unchanged': True, 'scope': inputs['scope']}
          Path('qualification/release-output.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          sha256sum target/release/canopy > qualification/canopy.sha256
          tar -czf qualification/canopy-release-linux.tar.gz -C target/release canopy
      - name: Retain qualification evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-correctness-${{ github.sha }}-${{ github.run_attempt }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30

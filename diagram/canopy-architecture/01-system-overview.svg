 stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-slate)"/><rect x="35" y="145" width="155" height="75" rx="7" fill="#0f172a"/><rect x="35" y="145" width="155" height="75" rx="7" fill="#083344" fill-opacity=".4" stroke="#22d3ee" stroke-width="1.4"/><rect x="35" y="285" width="155" height="75" rx="7" fill="#0f172a"/><rect x="35" y="285" width="155" height="75" rx="7" fill="#083344" fill-opacity=".4" stroke="#22d3ee" stroke-width="1.4"/><rect x="35" y="425" width="155" height="75" rx="7" fill="#0f172a"/><rect x="35" y="425" width="155" height="75" rx="7" fill="#083344" fill-opacity=".4" stroke="#22d3ee" stroke-width="1.4"/><rect x="255" y="145" width="185" height="90" rx="7" fill="#0f172a"/><rect x="255" y="145" width="185" height="90" rx="7" fill="#083344" fill-opacity=".4" stroke="#22d3ee" stroke-width="1.4"/><rect x="480" y="145" width="185" height="90" rx="7" fill="#0f172a"/><rect x="480" y="145" width="185" height="90" rx="7" fill="#7c2d12" fill-opacity=".4" stroke="#fb923c" stroke-width="1.4"/><rect x="255" y="290" width="410" height="100" rx="7" fill="#0f172a"/><rect x="255" y="290" width="410" height="100" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="255" y="450" width="410" height="100" rx="7" fill="#0f172a"/><rect x="255" y="450" width="410" height="100" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="765" y="145" width="275" height="95" rx="7" fill="#0f172a"/><rect x="765" y="145" width="275" height="95" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="765" y="300" width="275" height="95" rx="7" fill="#0f172a"/><rect x="765" y="300" width="275" height="95" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="765" y="485" width="275" height="100" rx="7" fill="#0f172a"/><rect x="765" y="485" width="275" height="100" rx="7" fill="#1e293b" fill-opacity=".4" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="255" y="685" width="785" height="100" rx="7" fill="#0f172a"/><rect x="255" y="685" width="785" height="100" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="35" y="690" width="175" height="123" rx="7" fill="#0f172a"/><rect x="35" y="690" width="175" height="123" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><text x="112.5" y="170" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Git clients</text><text x="112.5" y="190" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Smart HTTP / SSH</text><text x="112.5" y="205" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">clone, fetch, push</text><text x="112.5" y="310" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Browser / API</text><text x="112.5" y="330" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Embedded web UI</text><text x="112.5" y="345" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">JSON collaboration API</text><text x="112.5" y="450" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Git LFS</text><text x="112.5" y="470" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">HTTP bodies / locks</text><text x="112.5" y="485" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">SSH can issue grants</text><text x="347.5" y="170" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Ingress</text><text x="347.5" y="190" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Axum HTTP router</text><text x="347.5" y="205" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Optional russh listener</text><text x="347.5" y="220" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Account authentication</text><text x="572.5" y="170" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">RepositoryManager</text><text x="572.5" y="190" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Name resolution</text><text x="572.5" y="205" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Residency + request pins</text><text x="572.5" y="220" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Local / peer Cell handles</text><text x="460.0" y="315" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Product services</text><text x="460.0" y="335" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">GitGateway + LfsService + repository_http</text><text x="460.0" y="350" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Browse, issues, PRs, reviews, checks, policy</text><text x="460.0" y="365" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Native Git work runs on the receiving node</text><text x="460.0" y="475" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Cellule integration</text><text x="460.0" y="495" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">CanopyApplication + CellNode</text><text x="460.0" y="510" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Typed SQL / domain commands</text><text x="460.0" y="525" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Fenced ownership + durable output gate</text><text x="902.5" y="170" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Directory Cell</text><text x="902.5" y="190" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">One fixed SQL shard per tenant</text><text x="902.5" y="205" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Names -&gt; stable repository UUID</text><text x="902.5" y="220" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Accounts, tokens, keys, audit</text><text x="902.5" y="325" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Repository Cell</text><text x="902.5" y="345" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">One SQL Cell per repository UUID</text><text x="902.5" y="360" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Refs, objects, ACL, collaboration</text><text x="902.5" y="375" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Outcomes, closure and policy</text><text x="902.5" y="510" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Disposable Git cache</text><text x="902.5" y="530" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Private refs + verified shared objects</text><text x="902.5" y="545" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Native receive/upload-pack workers</text><text x="902.5" y="560" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Can be rebuilt after local disk loss</text><text x="647.5" y="710" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Shared S3-compatible object store</text><text x="647.5" y="730" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Cellule: catalog, authority, node leases, LTX roots and immutable SQLite recovery bytes</text><text x="647.5" y="745" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Canopy: external Git blobs, archived pack/index bytes and Git LFS bodies</text><text x="647.5" y="760" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Conditional writes select authority; verified immutable bytes supply recovery</text><text x="715.0" y="166.0" fill="#a78bfa" font-size="8" text-anchor="middle" font-weight="400">resolve / auth</text><text x="460.0" y="411.0" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">typed operations</text><text x="718" y="453" fill="#94a3b8" font-size="8" text-anchor="middle" font-weight="400">native work</text><text x="520" y="628" fill="#a78bfa" font-size="8" text-anchor="middle" font-weight="400">durable publication / external body I/O</text><text x="958" y="460" fill="#94a3b8" font-size="8" text-anchor="middle" font-weight="400">hydrate</text><text x="122.5" y="715" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Ownership rule</text><text x="122.5" y="735" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Git success is</text><text x="122.5" y="750" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">acknowledged only after</text><text x="122.5" y="765" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">the Cell commits and</text><text x="122.5" y="780" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">passes its durability</text><text x="122.5" y="795" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">gate.</text><circle cx="39" cy="857" r="4" fill="#22d3ee"/><text x="51" y="860" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">public clients</text><circle cx="152.2" cy="857" r="4" fill="#34d399"/><text x="164.2" y="860" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">product logic</text><circle cx="260.6" cy="857" r="4" fill="#60a5fa"/><text x="272.6" y="860" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">framework</text><circle cx="349.8" cy="857" r="4" fill="#a78bfa"/><text x="361.8" y="860" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">durable authority</text><circle cx="477.4" cy="857" r="4" fill="#94a3b8"/><text x="489.4" y="860" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">rebuildable local files</text><text x="30" y="33" font-size="16" font-weight="700" fill="#f8fafc">Canopy system architecture</text><text x="30" y="56" font-size="9" fill="#94a3b8">Clients enter any node; Cell authority and immutable storage preserve repository state.</text><text x="1070" y="33" font-size="8" text-anchor="end" fill="#fbbf24">CURRENT SERVING PATH</text>
</svg>
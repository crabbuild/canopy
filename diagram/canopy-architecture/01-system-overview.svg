<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
<title id="title">Canopy system architecture</title><desc id="desc">Canopy is an embedded Cellule application. Public ingress and native Git run in Canopy, while each durable Directory or Repository Cell has one fenced owner. A receiving node may call a remote owner. The object store holds authority records, SQLite recovery roots and product body objects. Native Git caches are disposable.</desc>

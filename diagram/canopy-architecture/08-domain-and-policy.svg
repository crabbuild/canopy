<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="35" y="95" width="1030" height="350" rx="12" fill="none" stroke="#a78bfa" stroke-dasharray="8 4"/><text x="51" y="115" fill="#a78bfa" font-size="9" text-anchor="start" font-weight="600">ONE REPOSITORY CELL / ONE UUID / ONE FENCED WRITER</text><rect x="35" y="495" width="1030" height="335" rx="12" fill="none" stroke="#34d399" stroke-dasharray="8 4"/><text x="51" y="515" fill="#34d399" font-size="9" text-anchor="start" font-weight="600">EXAMPLE: MERGE A PULL REQUEST</text><rect x="35" y="880" width="1030" height="175" rx="12" fill="none" stroke="#fb923c" stroke-dasharray="8 4"/><text x="51" y="900" fill="#fb923c" font-size="9" text-anchor="start" font-weight="600">DIRECTORY AND REPOSITORY ARE SEPARATE TRANSACTION DOMAINS</text><path d="M 360,602 L 400,602" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M 700,602 L 740,602" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M 500,974 L 570,974" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="60" y="150" width="300" height="100" rx="7" fill="#0f172a"/><rect x="60" y="150" width="300" height="100" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="400" y="150" width="300" height="100" rx="7" fill="#0f172a"/><rect x="400" y="150" width="300" height="100" rx="7" fill="#881337" fill-opacity=".4" stroke="#fb7185" stroke-width="1.4"/><rect x="740" y="150" width="300" height="100" rx="7" fill="#0f172a"/><rect x="740" y="150" width="300" height="100" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="60" y="295" width="300" height="100" rx="7" fill="#0f172a"/><rect x="60" y="295" width="300" height="100" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="400" y="295" width="300" height="100" rx="7" fill="#0f172a"/><rect x="400" y="295" width="300" height="100" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="740" y="295" width="300" height="100" rx="7" fill="#0f172a"/><rect x="740" y="295" width="300" height="100" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="60" y="550" width="300" height="105" rx="7" fill="#0f172a"/><rect x="60" y="550" width="300" height="105" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="400" y="550" width="300" height="105" rx="7" fill="#0f172a"/><rect x="400" y="550" width="300" height="105" rx="7" fill="#881337" fill-opacity=".4" stroke="#fb7185" stroke-width="1.4"/><rect x="740" y="550" width="300" height="105" rx="7" fill="#0f172a"/><rect x="740" y="550" width="300" height="105" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="60" y="710" width="440" height="85" rx="7" fill="#0f172a"/><rect x="60" y="710" width="440" height="85" rx="7" fill="#881337" fill-opacity=".4" stroke="#fb7185" stroke-width="1.4"/><rect x="570" y="710" width="470" height="85" rx="7" fill="#0f172a"/><rect x="570" y="710" width="470" height="85" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><rect x="60" y="930" width="440" height="85" rx="7" fill="#0f172a"/><rect x="60" y="930" width="440" height="85" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="570" y="930" width="470" height="85" rx="7" fill="#0f172a"/><rect x="570" y="930" width="470" height="85" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><text x="210.0" y="175" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Git identity and history</text><text x="210.0" y="195" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Object format, objects and graph</text><text x="210.0" y="210" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Refs, versions, HEAD, generation</text><text x="550.0" y="175" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Access and policy</text><text x="550.0" y="195" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Owner / members / visibility</text><text x="550.0" y="210" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Branch rules and version guards</text><text x="890.0" y="175" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Issues and discussions</text><text x="890.0" y="195" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Issues, comments and edits</text><text x="890.0" y="210" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Request records / pagination</text><text x="210.0" y="320" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Pull requests and reviews</text><text x="210.0" y="340" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Exact base/head comparisons</text><text x="210.0" y="355" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Reviews, threads and resolution</text><text x="550.0" y="320" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Checks and candidates</text><text x="550.0" y="340" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Commit-bound check attempts</text><text x="550.0" y="355" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Merge / squash / rebase candidates</text><text x="890.0" y="320" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Durable operation outcomes</text><text x="890.0" y="340" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Push reports / certificate audit</text><text x="890.0" y="355" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Mutation replay and receipts</text><text x="210.0" y="575" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Prepare candidate</text><text x="210.0" y="595" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Authenticate and capture base/head</text><text x="210.0" y="610" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Native merge-tree / commit-tree</text><text x="210.0" y="625" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Persist candidate objects + closure</text><text x="550.0" y="575" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Publish with MergePull</text><text x="550.0" y="595" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Recheck actor and exact revisions</text><text x="550.0" y="610" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Required checks / reviews / threads</text><text x="550.0" y="625" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Branch policy + ref expectations</text><text x="890.0" y="575" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Commit and acknowledge</text><text x="890.0" y="595" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Update branch ref + generation</text><text x="890.0" y="610" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Close PR + save merge outcome</text><text x="890.0" y="625" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Cellule gates durable result</text><text x="280.0" y="735" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Preparation is provisional</text><text x="280.0" y="755" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">A candidate or passed check cannot grant publication. The final command</text><text x="280.0" y="770" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">checks the current branch and exact candidate/head bindings.</text><text x="805.0" y="735" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">CI and web boundaries</text><text x="805.0" y="755" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Checks are product records submitted through the API. Canopy does not install a</text><text x="805.0" y="770" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Repository Cell workflow runner for CI today.</text><text x="280.0" y="955" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Directory Cell</text><text x="280.0" y="975" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Global accounts / token scopes / SSH keys</text><text x="280.0" y="990" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Names and discovery candidates; pending -&gt; ready</text><text x="805.0" y="955" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Repository Cell</text><text x="805.0" y="975" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Actual membership, visibility and write policy</text><text x="805.0" y="990" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Each sensitive transaction checks its own authority</text><text x="535.0" y="965.0" fill="#fb923c" font-size="8" text-anchor="middle" font-weight="400">UUID</text><circle cx="39" cy="1087" r="4" fill="#a78bfa"/><text x="51" y="1090" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">durable domain state</text><circle cx="181.0" cy="1087" r="4" fill="#fb7185"/><text x="193.0" y="1090" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">final authorization / guards</text><circle cx="361.4" cy="1087" r="4" fill="#34d399"/><text x="373.4" y="1090" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">collaboration logic</text><circle cx="498.59999999999997" cy="1087" r="4" fill="#60a5fa"/><text x="510.59999999999997" y="1090" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">durable outcome</text><text x="30" y="33" font-size="16" font-weight="700" fill="#f8fafc">Repository components and collaboration control</text><text x="30" y="56" font-size="9" fill="#94a3b8">Git state, authorization and collaboration meet at one Repository Cell transaction boundary.</text><text x="1070" y="33" font-size="8" text-anchor="end" fill="#fbbf24">CURRENT SERVING PATH</text>
</svg>
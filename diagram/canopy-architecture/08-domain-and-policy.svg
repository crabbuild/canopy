<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1130" role="img" aria-labelledby="title desc">
<title id="title">Repository components and collaboration control</title><desc id="desc">The Repository Cell colocates Git refs and graph metadata with ACLs, visibility, issues, PRs, reviews, line threads, check attempts, branch rules and operation outcomes. Merge preparation may run native Git outside the authority boundary, but MergePull rechecks current exact revisions, policy and required evidence before atomically changing the branch and PR state. Directory and Repository state remain separate Cells.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1190" role="img" aria-labelledby="title desc">
<title id="title">Request routing and repository residency</title><desc id="desc">Directory state authenticates accounts and resolves ready repository names. RepositoryManager binds a stable target to either a local actor or a signed peer client. Cold transitions are admitted and supervised; remote-owner loss triggers acquisition on demand. Repository authorization is checked using current durable state. Response pins prevent eviction during streaming.</desc>

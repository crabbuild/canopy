400" y="900" width="300" height="95" rx="7" fill="#0f172a"/><rect x="400" y="900" width="300" height="95" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="35" y="230" width="285" height="135" rx="7" fill="#0f172a"/><rect x="35" y="230" width="285" height="135" rx="7" fill="#1e293b" fill-opacity=".4" stroke="#94a3b8" stroke-width="1.4"/><rect x="785" y="375" width="280" height="135" rx="7" fill="#0f172a"/><rect x="785" y="375" width="280" height="135" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><rect x="35" y="1040" width="490" height="85" rx="7" fill="#0f172a"/><rect x="35" y="1040" width="490" height="85" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><rect x="575" y="1040" width="490" height="85" rx="7" fill="#0f172a"/><rect x="575" y="1040" width="490" height="85" rx="7" fill="#1e293b" fill-opacity=".4" stroke="#94a3b8" stroke-width="1.4"/><text x="550.0" y="130" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Incoming request</text><text x="550.0" y="150" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">HTTP / SSH / API / Git LFS</text><text x="550.0" y="255" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Directory Cell</text><text x="550.0" y="275" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Validate token / key / LFS grant</text><text x="550.0" y="290" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Resolve ready owner/name -&gt; UUID</text><text x="550.0" y="400" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">RepositoryManager</text><text x="550.0" y="420" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Derive target; pin resident route</text><text x="550.0" y="435" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Otherwise admit a transition</text><text x="550" y="571.5" fill="#f1f5f9" font-size="10" text-anchor="middle" font-weight="600">Live owner</text><text x="550" y="586.5" fill="#f1f5f9" font-size="10" text-anchor="middle" font-weight="600">elsewhere?</text><text x="235.0" y="720" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Remote Cell binding</text><text x="235.0" y="740" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">CellClient::peer -&gt; /internal/cell</text><text x="235.0" y="755" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Signed request + enrolled node key</text><text x="235.0" y="770" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">TLS, release, expiry, principal checks</text><text x="865.0" y="720" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Local acquisition</text><text x="865.0" y="740" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Bootstrap new / acquire idle Cell</text><text x="865.0" y="755" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Expired owner: fence + restore exact root</text><text x="865.0" y="770" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">CellClient::local -&gt; resident actor</text><text x="550.0" y="925" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Repository operations</text><text x="550.0" y="945" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Recheck current ACL / visibility</text><text x="550.0" y="960" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Run domain command or native Git</text><text x="550.0" y="975" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Retain route pin through response</text><text x="330" y="565" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">Yes</text><text x="758" y="565" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">No</text><text x="177.5" y="255" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Discovery is a hint</text><text x="177.5" y="275" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Directory listing candidates are checked</text><text x="177.5" y="290" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">against current Repository Cell access. Cached</text><text x="177.5" y="305" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">names and UI state cannot grant permissions.</text><text x="925.0" y="400" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Bounded transitions</text><text x="925.0" y="420" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Cold/remote work uses supervised admission and</text><text x="925.0" y="435" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">a per-repository transition lock. Different</text><text x="925.0" y="450" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">repositories can activate concurrently.</text><text x="280.0" y="1065" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Capacity and cancellation</text><text x="280.0" y="1085" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">An unavailable slot or in-progress movement can return 503. Streamed responses and</text><text x="280.0" y="1100" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">detached admitted work retain pins until they finish.</text><text x="820.0" y="1065" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Native work placement</text><text x="820.0" y="1085" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Remote binding moves Cell calls. Git workers, body streaming and the disposable cache</text><text x="820.0" y="1100" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">can remain on the receiving gateway.</text><circle cx="39" cy="1147" r="4" fill="#22d3ee"/><text x="51" y="1150" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">request</text><circle cx="118.6" cy="1147" r="4" fill="#a78bfa"/><text x="130.6" y="1150" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">identity / authority</text><circle cx="260.6" cy="1147" r="4" fill="#fb923c"/><text x="272.6" y="1150" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">admission</text><circle cx="349.8" cy="1147" r="4" fill="#60a5fa"/><text x="361.8" y="1150" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">local or signed remote execution</text><text x="30" y="33" font-size="16" font-weight="700" fill="#f8fafc">Request routing and repository residency</text><text x="30" y="56" font-size="9" fill="#94a3b8">Authentication, name lookup, account admission and owner resolution precede repository work.</text><text x="1070" y="33" font-size="8" text-anchor="end" fill="#fbbf24">CURRENT SERVING PATH</text>
</svg>
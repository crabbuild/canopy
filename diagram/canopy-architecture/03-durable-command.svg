<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1040" role="img" aria-labelledby="title desc">
<title id="title">Cellule command execution and durability</title><desc id="desc">This is the object-store durability path assembled by Canopy. The Cell owner records domain state and the request outcome together, captures SQLite through LTX and publishes the exact root using a fenced conditional authority update. Only then does the caller receive Committed and a receipt. A Cellule follower-log mode exists, but this diagram does not claim Canopy enables it.</desc>
<defs><style>text {font-family: 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace;}</style><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#fb7185"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#fb923c"/></marker><marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#94a3b8"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#60a5fa"/></marker></defs>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<rect class="sequence-activation" x="335" y="220" width="10" height="550" fill="#7c2d12" stroke="#fb923c"/><rect class="sequence-activation" x="560" y="370" width="10" height="95" fill="#064e3b" stroke="#34d399"/><rect class="sequence-activation" x="790" y="510" width="10" height="95" fill="#4c1d95" stroke="#a78bfa"/><rect class="sequence-activation" x="1020" y="650" width="10" height="65" fill="#78350f" stroke="#fbbf24"/><rect x="30" y="110" width="170" height="65" rx="7" fill="#0f172a"/><rect x="30" y="110" width="170" height="65" rx="7" fill="#083344" fill-opacity=".4" stroke="#22d3ee" stroke-width="1.4"/><rect x="255" y="110" width="170" height="65" rx="7" fill="#0f172a"/><rect x="255" y="110" width="170" height="65" rx="7" fill="#7c2d12" fill-opacity=".4" stroke="#fb923c" stroke-width="1.4"/><rect x="480" y="110" width="170" height="65" rx="7" fill="#0f172a"/><rect x="480" y="110" width="170" height="65" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="710" y="110" width="170" height="65" rx="7" fill="#0f172a"/><rect x="710" y="110" width="170" height="65" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="940" y="110" width="170" height="65" rx="7" fill="#0f172a"/><rect x="940" y="110" width="170" height="65" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><rect x="35" y="865" width="490" height="110" rx="7" fill="#0f172a"/><rect x="35" y="865" width="490" height="110" rx="7" fill="#881337" fill-opacity=".4" stroke="#fb7185" stroke-width="1.4"/><rect x="575" y="865" width="490" height="110" rx="7" fill="#0f172a"/><rect x="575" y="865" width="490" height="110" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><path class="sequence-lifeline" d="M115 175 V835" stroke="#334155" stroke-dasharray="6 5"/><path class="sequence-lifeline" d="M340 175 V835" stroke="#334155" stroke-dasharray="6 5"/><path class="sequence-lifeline" d="M565 175 V835" stroke="#334155" stroke-dasharray="6 5"/><path class="sequence-lifeline" d="M795 175 V835" stroke="#334155" stroke-dasharray="6 5"/><path class="sequence-lifeline" d="M1025 175 V835" stroke="#334155" stroke-dasharray="6 5"/><path d="M 115,225 L 340,225" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/><path d="M 340,290 L 1025,290" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/><path d="M 340,375 L 565,375" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M 565,445 L 340,445" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/><path d="M 340,525 L 795,525" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><path d="M 795,595 L 340,595" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/><path d="M 340,660 L 1025,660" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/><path d="M 1025,730 L 340,730" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/><path d="M 340,795 L 115,795" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/><text x="115.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Canopy caller</text><text x="115.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Typed handle</text><text x="340.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Cell owner</text><text x="340.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Actor + fence</text><text x="565.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Managed SQLite</text><text x="565.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">State + ledger</text><text x="795.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">LTX / object store</text><text x="795.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Immutable roots</text><text x="1025.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">CellAuthority</text><text x="1025.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Control CAS</text><text x="227.5" y="216.0" fill="#22d3ee" font-size="8" text-anchor="middle" font-weight="400">1  Command + stable MutationIdentity</text><text x="682.5" y="281.0" fill="#fbbf24" font-size="8" text-anchor="middle" font-weight="400">2  Validate owner incarnation / lease / compatible code</text><text x="452.5" y="366.0" fill="#34d399" font-size="8" text-anchor="middle" font-weight="400">3  Execute domain mutation + request outcome in one transaction</text><text x="452.5" y="436.0" fill="#34d399" font-size="8" text-anchor="middle" font-weight="400">4  Commit SQLite and capture its exact WAL boundary</text><text x="567.5" y="516.0" fill="#a78bfa" font-size="8" text-anchor="middle" font-weight="400">5  Verify capture; upload immutable chunks and proposed root</text><text x="567.5" y="586.0" fill="#a78bfa" font-size="8" text-anchor="middle" font-weight="400">6  Return proposed recovery root</text><text x="682.5" y="651.0" fill="#fbbf24" font-size="8" text-anchor="middle" font-weight="400">7  Conditional publish of the exact root under owner fence</text><text x="682.5" y="721.0" fill="#fbbf24" font-size="8" text-anchor="middle" font-weight="400">8  Accepted authority revision = durable publication proof</text><text x="227.5" y="786.0" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">9  Committed&lt;Output&gt; + Receipt</text><text x="280.0" y="890" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Lost reply or rejected fence</text><text x="280.0" y="910" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">A timeout does not prove failure. Resolve the original request identity; retry the</text><text x="280.0" y="925" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">same logical command only under its existing identity.</text><text x="820.0" y="890" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Receipt and scope</text><text x="820.0" y="910" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">A receipt-bound query must observe the published per-Cell position. Directory and</text><text x="820.0" y="925" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Repository commands do not form one cross-Cell SQL transaction.</text><circle cx="39" cy="997" r="4" fill="#22d3ee"/><text x="51" y="1000" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">invocation</text><circle cx="133.0" cy="997" r="4" fill="#34d399"/><text x="145.0" y="1000" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">local transaction</text><circle cx="260.6" cy="997" r="4" fill="#a78bfa"/><text x="272.6" y="1000" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">immutable bytes</text><circle cx="378.6" cy="997" r="4" fill="#fbbf24"/><text x="390.6" y="1000" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">authority publication</text><circle cx="525.4000000000001" cy="997" r="4" fill="#60a5fa"/><text x="537.4000000000001" y="1000" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">durable acknowledgement</text><text x="30" y="33" font-size="16" font-weight="700" fill="#f8fafc">Cellule command execution and durability</text><text x="30" y="56" font-size="9" fill="#94a3b8">One command changes one Cell. The domain mutation and its recorded answer share a SQLite transaction.</text><text x="1110" y="33" font-size="8" text-anchor="end" fill="#fbbf24">CURRENT SERVING PATH</text>
</svg>
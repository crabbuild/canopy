<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1300" role="img" aria-labelledby="title desc">
<title id="title">Git push from wire input to durable refs</title><desc id="desc">After outer authentication, GitGateway spools and hashes the encoded request and binds a logical push ID to the actor and digest. It can replay a completed push before decoding and native work. New attempts prepare a private ref snapshot, run receive-pack, ingest canonical objects, certify graph closure and stage the report and ref plan. CompletePush checks current policy and expected ref versions and commits accepted refs with the canonical response pointer. Cellule gates acknowledgement on durable publication.</desc>
<defs><style>text {font-family: 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace;}</style><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#22d3ee"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#34d399"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#a78bfa"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#fbbf24"/></marker><marker id="arrow-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#fb7185"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#fb923c"/></marker><marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#94a3b8"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#60a5fa"/></marker></defs>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="35" y="720" width="1030" height="100" rx="12" fill="none" stroke="#34d399" stroke-dasharray="8 4"/><text x="51" y="740" fill="#34d399" font-size="9" text-anchor="start" font-weight="600">FINAL DOMAIN TRANSACTION: ACCEPTED REFS + GENERATION + OUTCOME POINTER / AUDIT</text><rect x="30" y="110" width="160" height="65" rx="7" fill="#0f172a"/><rect x="30" y="110" width="160" height="65" rx="7" fill="#083344" fill-opacity=".4" stroke="#22d3ee" stroke-width="1.4"/><rect x="255" y="110" width="160" height="65" rx="7" fill="#0f172a"/><rect x="255" y="110" width="160" height="65" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="480" y="110" width="160" height="65" rx="7" fill="#0f172a"/><rect x="480" y="110" width="160" height="65" rx="7" fill="#1e293b" fill-opacity=".4" stroke="#94a3b8" stroke-width="1.4"/><rect x="720" y="110" width="160" height="65" rx="7" fill="#0f172a"/><rect x="720" y="110" width="160" height="65" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="950" y="110" width="160" height="65" rx="7" fill="#0f172a"/><rect x="950" y="110" width="160" height="65" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="35" y="1080" width="490" height="125" rx="7" fill="#0f172a"/><rect x="35" y="1080" width="490" height="125" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><rect x="575" y="1080" width="490" height="125" rx="7" fill="#0f172a"/><rect x="575" y="1080" width="490" height="125" rx="7" fill="#881337" fill-opacity=".4" stroke="#fb7185" stroke-width="1.4"/><path class="sequence-lifeline" d="M110 175 V1045" stroke="#334155" stroke-dasharray="6 5"/><path class="sequence-lifeline" d="M335 175 V1045" stroke="#334155" stroke-dasharray="6 5"/><path class="sequence-lifeline" d="M560 175 V1045" stroke="#334155" stroke-dasharray="6 5"/><path class="sequence-lifeline" d="M800 175 V1045" stroke="#334155" stroke-dasharray="6 5"/><path class="sequence-lifeline" d="M1030 175 V1045" stroke="#334155" stroke-dasharray="6 5"/><path d="M 110,225 L 335,225" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/><path d="M 335,285 L 800,285" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M 800,345 L 335,345" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/><path d="M 335,405 L 800,405" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M 335,465 L 560,465" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M 560,525 L 335,525" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-slate)"/><path d="M 335,585 L 1030,585" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><path d="M 335,645 L 800,645" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M 335,705 L 800,705" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M 335,765 L 800,765" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M 800,835 L 1030,835" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><path d="M 1030,895 L 800,895" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/><path d="M 800,955 L 335,955" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/><path d="M 335,1015 L 110,1015" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-cyan)"/><text x="110.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Git client</text><text x="110.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">receive-pack</text><text x="335.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">GitGateway</text><text x="335.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Receiving node</text><text x="560.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Native Git</text><text x="560.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Disposable refs</text><text x="800.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Repository Cell</text><text x="800.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Via local / peer client</text><text x="1030.0" y="135" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Object store</text><text x="1030.0" y="155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Verified body bytes</text><text x="222.5" y="216.0" fill="#22d3ee" font-size="8" text-anchor="middle" font-weight="400">1  Spool encoded input; bind push UUID + actor + request digest</text><text x="567.5" y="276.0" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">2  begin_push: claim logical ID or find completed response</text><text x="567.5" y="336.0" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">3  Completed ID replays saved result; fresh ID continues</text><text x="567.5" y="396.0" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">4  Read consistent refs, generation and branch policy</text><text x="447.5" y="456.0" fill="#34d399" font-size="8" text-anchor="middle" font-weight="400">5  Decode / validate; receive-pack in private cache</text><text x="447.5" y="516.0" fill="#94a3b8" font-size="8" text-anchor="middle" font-weight="400">6  Native report + actual accepted ref differences</text><text x="682.5" y="576.0" fill="#a78bfa" font-size="8" text-anchor="middle" font-weight="400">7  Upload verified external blobs or archived pack/index bytes</text><text x="567.5" y="636.0" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">8  Persist canonical object records in bounded batches</text><text x="567.5" y="696.0" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">9  Certify typed graph closure; stage response + ref plan</text><text x="567.5" y="756.0" fill="#34d399" font-size="8" text-anchor="middle" font-weight="400">10  CompletePush: recheck ACL, branch rules, OIDs and versions</text><text x="915.0" y="826.0" fill="#a78bfa" font-size="8" text-anchor="middle" font-weight="400">11  Cellule publishes SQLite root</text><text x="915.0" y="886.0" fill="#a78bfa" font-size="8" text-anchor="middle" font-weight="400">12  Fenced durable proof</text><text x="567.5" y="946.0" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">13  Read canonical saved response</text><text x="222.5" y="1006.0" fill="#22d3ee" font-size="8" text-anchor="middle" font-weight="400">14  Git report + push identity</text><text x="280.0" y="1105" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Two identities matter</text><text x="280.0" y="1125" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">The HTTP push UUID identifies the whole wire operation. Cellule MutationIdentity</text><text x="280.0" y="1140" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">identifies each durable command within that operation.</text><text x="820.0" y="1105" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Failure behavior</text><text x="820.0" y="1125" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Preparation changes disposable refs only. Objects may remain unreferenced after</text><text x="820.0" y="1140" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">refusal. An uncertain final publication is resolved, never turned into a false</text><text x="820.0" y="1155" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">negative report.</text><text x="35" y="1230" fill="#94a3b8" font-size="9" text-anchor="start" font-weight="400">Native partial acceptance is preserved; Git --atomic can request all-or-none validation. Current gateway push work uses a mutex.</text><circle cx="39" cy="1257" r="4" fill="#22d3ee"/><text x="51" y="1260" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">wire protocol</text><circle cx="147.4" cy="1257" r="4" fill="#94a3b8"/><text x="159.4" y="1260" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">private native state</text><circle cx="289.4" cy="1257" r="4" fill="#60a5fa"/><text x="301.4" y="1260" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">durable Cell calls</text><circle cx="421.79999999999995" cy="1257" r="4" fill="#a78bfa"/><text x="433.79999999999995" y="1260" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">body / root publication</text><text x="30" y="33" font-size="16" font-weight="700" fill="#f8fafc">Git push from wire input to durable refs</text><text x="30" y="56" font-size="9" fill="#94a3b8">Current serving path: native Git prepares private state; CompletePush publishes refs and the saved result.</text><text x="1110" y="33" font-size="8" text-anchor="end" fill="#fbbf24">CURRENT SERVING PATH</text>
</svg>
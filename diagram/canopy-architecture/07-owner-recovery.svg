60" y="380" width="290" height="100" rx="7" fill="#0f172a"/><rect x="60" y="380" width="290" height="100" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="390" y="380" width="310" height="100" rx="7" fill="#0f172a"/><rect x="390" y="380" width="310" height="100" rx="7" fill="#7c2d12" fill-opacity=".4" stroke="#fb923c" stroke-width="1.4"/><rect x="740" y="380" width="300" height="100" rx="7" fill="#0f172a"/><rect x="740" y="380" width="300" height="100" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="390" y="590" width="310" height="105" rx="7" fill="#0f172a"/><rect x="390" y="590" width="310" height="105" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="740" y="590" width="300" height="105" rx="7" fill="#0f172a"/><rect x="740" y="590" width="300" height="105" rx="7" fill="#1e293b" fill-opacity=".4" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="60" y="590" width="290" height="105" rx="7" fill="#0f172a"/><rect x="60" y="590" width="290" height="105" rx="7" fill="#881337" fill-opacity=".4" stroke="#fb7185" stroke-width="1.4"/><rect x="60" y="880" width="290" height="110" rx="7" fill="#0f172a"/><rect x="60" y="880" width="290" height="110" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><rect x="390" y="880" width="310" height="110" rx="7" fill="#0f172a"/><rect x="390" y="880" width="310" height="110" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><rect x="740" y="880" width="300" height="110" rx="7" fill="#0f172a"/><rect x="740" y="880" width="300" height="110" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><text x="205.0" y="165" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Startup preflight</text><text x="205.0" y="185" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Lock managed local workspace</text><text x="205.0" y="200" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Probe conditional writes / ranged I/O</text><text x="205.0" y="215" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Compile and check selected release</text><text x="545.0" y="165" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Enroll and renew node</text><text x="545.0" y="185" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Signed live node advertisement</text><text x="545.0" y="200" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">NodeLeaseGuard + compatible registry</text><text x="545.0" y="215" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Start Directory + on-demand repos</text><text x="890.0" y="165" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Serve with fencing</text><text x="890.0" y="185" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Ready only while leases are valid</text><text x="890.0" y="200" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Per-Cell authority / actor / SQL</text><text x="890.0" y="215" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Cancel ingress when lease fails</text><text x="205.0" y="405" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Read catalog and control</text><text x="205.0" y="425" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Validate compiled code and schema</text><text x="205.0" y="440" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Live owner: route to that owner</text><text x="205.0" y="455" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Idle or expired: acquire authority</text><text x="545.0" y="405" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Fence and choose exact root</text><text x="545.0" y="425" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Claim expired node for takeover</text><text x="545.0" y="440" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Use CellAuthority-pinned root</text><text x="545.0" y="455" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Do not elect a root by listing keys</text><text x="890.0" y="405" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Verify and restore SQLite</text><text x="890.0" y="425" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">LTX chunk checksums / endpoints</text><text x="890.0" y="440" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Recover exact state + outcome ledger</text><text x="890.0" y="455" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Invalid bytes: fail without activation</text><text x="545.0" y="615" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Activate successor</text><text x="545.0" y="635" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Same CellTarget / repository UUID</text><text x="545.0" y="650" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">New fenced owner / incarnation</text><text x="545.0" y="665" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Recovered refs, ACL and outcomes</text><text x="890.0" y="615" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Rebuild Git cache</text><text x="890.0" y="635" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Hydrate verified published objects</text><text x="890.0" y="650" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Recreate private ref snapshots</text><text x="890.0" y="665" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Resume Git/API/LFS requests</text><text x="205.0" y="615" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Cache loss is recoverable</text><text x="205.0" y="635" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Cell publication protects acknowledged state.</text><text x="205.0" y="650" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Files from an old workspace never become a</text><text x="205.0" y="665" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">substitute recovery root.</text><text x="60" y="749" fill="#94a3b8" font-size="9" text-anchor="start" font-weight="400">Recovery is on demand. An unclean owner loss waits for lease expiry; acquisition and restore stay supervised.</text><text x="205.0" y="905" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Graceful shutdown</text><text x="205.0" y="925" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Stop public ingress; finish admitted work</text><text x="205.0" y="940" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Drain Cells + close native descendants</text><text x="205.0" y="955" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Withdraw advertisement / release disk</text><text x="205.0" y="970" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Workspace stays locked through cleanup</text><text x="545.0" y="905" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Deployment maintenance</text><text x="545.0" y="925" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Close release admission with operation ID</text><text x="545.0" y="940" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Fleet drains; prove all Cells settled</text><text x="545.0" y="955" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Recovery worker fences expired owners</text><text x="545.0" y="970" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Explicit end reopens same release</text><text x="890.0" y="905" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Backup and restore</text><text x="890.0" y="925" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Copy pinned roots + referenced bodies</text><text x="890.0" y="940" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Verify independent disjoint prefix</text><text x="890.0" y="955" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Restore into unused reserved prefix</text><text x="890.0" y="970" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Same provider; preserve identity</text><circle cx="39" cy="1107" r="4" fill="#fbbf24"/><text x="51" y="1110" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">node / deployment control</text><circle cx="205.0" cy="1107" r="4" fill="#fb923c"/><text x="217.0" y="1110" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">owner fence</text><circle cx="303.8" cy="1107" r="4" fill="#a78bfa"/><text x="315.8" y="1110" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">verified recovery bytes</text><circle cx="460.2" cy="1107" r="4" fill="#60a5fa"/><text x="472.2" y="1110" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">same Cell / new owner</text><text x="30" y="33" font-size="16" font-weight="700" fill="#f8fafc">Owner lifecycle and exact recovery</text><text x="30" y="56" font-size="9" fill="#94a3b8">A repository keeps its identity when its owner changes. Only authority can select the recovery root.</text><text x="1070" y="33" font-size="8" text-anchor="end" fill="#fbbf24">CURRENT SERVING PATH</text>

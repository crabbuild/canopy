<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1150" role="img" aria-labelledby="title desc">
<title id="title">Owner lifecycle and exact recovery</title><desc id="desc">Canopy locks its local runtime workspace, verifies storage capabilities, validates the selected release and enrolls a signed node lease before serving. New or cold Cells bootstrap, acquire idle authority or fence an expired owner and restore the authority-pinned SQLite root. Recovery preserves the request outcome ledger. Native caches rebuild afterward. Shutdown and maintenance supervise all admitted work; backup copies durable roots and referenced external bodies into an independent prefix.</desc>

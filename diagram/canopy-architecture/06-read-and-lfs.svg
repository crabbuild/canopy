<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="35" y="95" width="1030" height="330" rx="12" fill="none" stroke="#22d3ee" stroke-dasharray="8 4"/><text x="51" y="115" fill="#22d3ee" font-size="9" text-anchor="start" font-weight="600">GIT CLONE / FETCH</text><rect x="35" y="475" width="1030" height="245" rx="12" fill="none" stroke="#34d399" stroke-dasharray="8 4"/><text x="51" y="495" fill="#34d399" font-size="9" text-anchor="start" font-weight="600">BROWSE / JSON READS / LFS</text><rect x="35" y="770" width="1030" height="270" rx="12" fill="none" stroke="#a78bfa" stroke-dasharray="8 4"/><text x="51" y="790" fill="#a78bfa" font-size="9" text-anchor="start" font-weight="600">CURRENT SERVING STORAGE / AUTHORITATIVE METADATA REMAINS PER OBJECT</text><path d="M 330,192 L 390,192" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/><path d="M 700,192 L 760,192" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M 350,903 L 390,903" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><path d="M 700,903 L 740,903" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-slate)"/><rect x="60" y="150" width="270" height="85" rx="7" fill="#0f172a"/><rect x="60" y="150" width="270" height="85" rx="7" fill="#083344" fill-opacity=".4" stroke="#22d3ee" stroke-width="1.4"/><rect x="390" y="150" width="310" height="85" rx="7" fill="#0f172a"/><rect x="390" y="150" width="310" height="85" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="760" y="150" width="280" height="85" rx="7" fill="#0f172a"/><rect x="760" y="150" width="280" height="85" rx="7" fill="#1e293b" fill-opacity=".4" stroke="#94a3b8" stroke-width="1.4"/><rect x="60" y="290" width="440" height="95" rx="7" fill="#0f172a"/><rect x="60" y="290" width="440" height="95" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="570" y="290" width="470" height="95" rx="7" fill="#0f172a"/><rect x="570" y="290" width="470" height="95" rx="7" fill="#1e293b" fill-opacity=".4" stroke="#94a3b8" stroke-width="1.4"/><rect x="60" y="530" width="280" height="115" rx="7" fill="#0f172a"/><rect x="60" y="530" width="280" height="115" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="400" y="530" width="280" height="115" rx="7" fill="#0f172a"/><rect x="400" y="530" width="280" height="115" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="740" y="530" width="300" height="115" rx="7" fill="#0f172a"/><rect x="740" y="530" width="300" height="115" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="60" y="825" width="290" height="155" rx="7" fill="#0f172a"/><rect x="60" y="825" width="290" height="155" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="390" y="825" width="310" height="155" rx="7" fill="#0f172a"/><rect x="390" y="825" width="310" height="155" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="740" y="825" width="300" height="155" rx="7" fill="#0f172a"/><rect x="740" y="825" width="300" height="155" rx="7" fill="#1e293b" fill-opacity=".4" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="35" y="1080" width="1030" height="65" rx="7" fill="#0f172a"/><rect x="35" y="1080" width="1030" height="65" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><text x="195.0" y="175" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Authorize and select</text><text x="195.0" y="195" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Current ACL / public visibility</text><text x="195.0" y="210" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Validate wants against live refs</text><text x="545.0" y="175" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Snapshot and hydrate</text><text x="545.0" y="195" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Generation-consistent refs + HEAD</text><text x="545.0" y="210" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Verify required objects / bodies</text><text x="545.0" y="225" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Apply supported partial-clone filter</text><text x="900.0" y="175" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Native upload-pack</text><text x="900.0" y="195" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Private ref snapshot</text><text x="900.0" y="210" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Shared verified object files</text><text x="900.0" y="225" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Stream generated pack to client</text><text x="280.0" y="315" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Discovery fast path</text><text x="280.0" y="335" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Git v2 capability discovery needs no object hydration. Ref discovery</text><text x="280.0" y="350" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">prepares ref targets and annotated tag chains.</text><text x="805.0" y="315" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Selective fetch</text><text x="805.0" y="335" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Blobless fetch omits ordinary blobs. Selected wants, ref targets and structural</text><text x="805.0" y="350" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">history determine hydration; warm verified objects are reused.</text><text x="200.0" y="555" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Repository browser</text><text x="200.0" y="575" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Read trees, blobs, history and diffs</text><text x="200.0" y="590" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Use Repository Cell metadata</text><text x="200.0" y="605" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Load bodies from verified readers</text><text x="200.0" y="620" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">No receive-pack is needed</text><text x="540.0" y="555" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">LFS upload</text><text x="540.0" y="575" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Authorize batch / PUT</text><text x="540.0" y="590" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Hash SHA-256 + bounded parts</text><text x="540.0" y="605" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Publish immutable body, verify</text><text x="540.0" y="620" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Then commit authorized metadata</text><text x="890.0" y="555" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">LFS download</text><text x="890.0" y="575" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Authorize against current Cell</text><text x="890.0" y="590" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Read manifest pinned in SQLite</text><text x="890.0" y="605" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Verify requested parts / digests</text><text x="890.0" y="620" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Support tail Range / 206 response</text><text x="60" y="689" fill="#94a3b8" font-size="9" text-anchor="start" font-weight="400">LFS locks are advisory records in the Repository Cell. SSH grants still deliver LFS bytes over HTTP.</text><text x="205.0" y="850" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Repository SQLite</text><text x="205.0" y="870" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">objects: kind, size, digest, storage</text><text x="205.0" y="885" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">inline bodies &lt;= 768 KiB</text><text x="205.0" y="900" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Large non-blob bodies: SQL chunks</text><text x="205.0" y="915" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">refs + graph edges / certificates</text><text x="205.0" y="930" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">LFS metadata + locks</text><text x="545.0" y="850" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Immutable external bytes</text><text x="545.0" y="870" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Large loose Git blobs + manifests</text><text x="545.0" y="885" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Archived pack and index bodies</text><text x="545.0" y="900" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Packed blobs reference approved packs</text><text x="545.0" y="915" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Git LFS bodies + part digests</text><text x="545.0" y="930" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Readers verify canonical identities</text><text x="890.0" y="850" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Local cache</text><text x="890.0" y="870" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Hydrated Git files / installed packs</text><text x="890.0" y="885" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Insertion cursor + ref generations</text><text x="890.0" y="900" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Private native process workspace</text><text x="890.0" y="915" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Disk and native-worker admission</text><text x="890.0" y="930" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Disposable after recovery</text><text x="370.0" y="894.0" fill="#a78bfa" font-size="8" text-anchor="middle" font-weight="400">references</text><text x="720.0" y="894.0" fill="#94a3b8" font-size="8" text-anchor="middle" font-weight="400">verify / hydrate</text><text x="60" y="1014" fill="#fbbf24" font-size="9" text-anchor="start" font-weight="400">This active archive path differs from the future immutable catalog / ref-root hard cutover in diagram 09.</text><text x="550.0" y="1105" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Read authority</text><text x="550.0" y="1125" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">An uploaded pack, cached object, stale listing or UI view cannot independently authorize an object read. Current Cell access and verified published metadata govern visibility.</text><circle cx="39" cy="1177" r="4" fill="#22d3ee"/><text x="51" y="1180" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">stock Git reads</text><circle cx="157.0" cy="1177" r="4" fill="#34d399"/><text x="169.0" y="1180" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">browse / selection</text><circle cx="289.4" cy="1177" r="4" fill="#a78bfa"/><text x="301.4" y="1180" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">durable state and bodies</text><circle cx="450.59999999999997" cy="1177" r="4" fill="#94a3b8"/><text x="462.59999999999997" y="1180" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">rebuildable work files</text><text x="30" y="33" font-size="16" font-weight="700" fill="#f8fafc">Fetch, browse and Git LFS data paths</text><text x="30" y="56" font-size="9" fill="#94a3b8">Reads verify identities against Cell metadata. LFS body delivery bypasses native Git.</text><text x="1070" y="33" font-size="8" text-anchor="end" fill="#fbbf24">CURRENT SERVING PATH</text>
</svg>
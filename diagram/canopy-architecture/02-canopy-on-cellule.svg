<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<rect x="35" y="95" width="1030" height="185" rx="12" fill="none" stroke="#34d399" stroke-dasharray="8 4"/><text x="51" y="115" fill="#34d399" font-size="9" text-anchor="start" font-weight="600">APPLICATION DECLARATION / COMPILED AT STARTUP</text><rect x="35" y="330" width="1030" height="190" rx="12" fill="none" stroke="#60a5fa" stroke-dasharray="8 4"/><text x="51" y="350" fill="#60a5fa" font-size="9" text-anchor="start" font-weight="600">RUNTIME ADDRESSING / STABLE ACROSS OWNER MOVEMENT</text><rect x="35" y="560" width="1030" height="230" rx="12" fill="none" stroke="#fbbf24" stroke-dasharray="8 4"/><text x="51" y="580" fill="#fbbf24" font-size="9" text-anchor="start" font-weight="600">EMBEDDED CELLULE FRAMEWORK / THE PINNED DEPENDENCY</text><path d="M 518,245 L 518,310 L 265,310 L 265,380" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M 875,245 L 875,380" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M 265,485 L 265,605" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M 795,485 L 795,540 L 545,540 L 545,605" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M 350,650 L 390,650" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/><path d="M 700,650 L 740,650" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><rect x="60" y="140" width="260" height="105" rx="7" fill="#0f172a"/><rect x="60" y="140" width="260" height="105" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="360" y="140" width="315" height="105" rx="7" fill="#0f172a"/><rect x="360" y="140" width="315" height="105" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="715" y="140" width="325" height="105" rx="7" fill="#0f172a"/><rect x="715" y="140" width="325" height="105" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="60" y="380" width="410" height="105" rx="7" fill="#0f172a"/><rect x="60" y="380" width="410" height="105" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="545" y="380" width="495" height="105" rx="7" fill="#0f172a"/><rect x="545" y="380" width="495" height="105" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="60" y="605" width="290" height="95" rx="7" fill="#0f172a"/><rect x="60" y="605" width="290" height="95" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="390" y="605" width="310" height="95" rx="7" fill="#0f172a"/><rect x="390" y="605" width="310" height="95" rx="7" fill="#7c2d12" fill-opacity=".4" stroke="#fb923c" stroke-width="1.4"/><rect x="740" y="605" width="300" height="95" rx="7" fill="#0f172a"/><rect x="740" y="605" width="300" height="95" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="35" y="840" width="490" height="115" rx="7" fill="#0f172a"/><rect x="35" y="840" width="490" height="115" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="575" y="840" width="490" height="115" rx="7" fill="#0f172a"/><rect x="575" y="840" width="490" height="115" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><text x="190.0" y="165" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">CanopyApplication</text><text x="190.0" y="185" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">CellApplication::register</text><text x="190.0" y="200" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">DirectoryModule + RepositoryModule</text><text x="190.0" y="215" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Two declared SQL Cell types</text><text x="517.5" y="165" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">DirectoryModule</text><text x="517.5" y="185" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">CatalogRole::Sql / one fixed shard</text><text x="517.5" y="200" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Namespace = [0x48; 16]</text><text x="517.5" y="215" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Names, accounts, credentials</text><text x="877.5" y="165" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">RepositoryModule</text><text x="877.5" y="185" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">CatalogRole::Sql / entity partitions</text><text x="877.5" y="200" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Namespace = [0x47; 16]</text><text x="877.5" y="215" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Git + ACL + collaboration commands</text><text x="265.0" y="405" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Directory target</text><text x="265.0" y="425" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Tenant + application + namespace</text><text x="265.0" y="440" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">partition_for_shard(0)</text><text x="265.0" y="455" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">DirectoryCell wraps SqlCell&lt;DirectoryModule&gt;</text><text x="792.5" y="405" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Repository target</text><text x="792.5" y="425" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Tenant + application + namespace + UUID-derived partition</text><text x="792.5" y="440" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">CellType::entity_partition -&gt; 33-byte partition</text><text x="792.5" y="455" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">RepositoryCell wraps SqlCell&lt;RepositoryModule&gt;</text><text x="949" y="312" fill="#60a5fa" font-size="8" text-anchor="middle" font-weight="400">UUID selects one Cell</text><text x="205.0" y="630" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">cellule-app + host</text><text x="205.0" y="650" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Descriptor / registry / typed handles</text><text x="205.0" y="665" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">CellNode lifecycle + readiness</text><text x="205.0" y="680" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Canopy installs facilities and leases</text><text x="545.0" y="630" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">cellule-runtime</text><text x="545.0" y="650" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Per-Cell actor + SQL worker</text><text x="545.0" y="665" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Authority fence + request ledger</text><text x="545.0" y="680" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Queries, commands, peer contracts</text><text x="890.0" y="630" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">cellule-ltx + store</text><text x="890.0" y="650" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Managed SQLite WAL capture</text><text x="890.0" y="665" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Verified roots + exact restoration</text><text x="890.0" y="680" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Bounded I/O + conditional updates</text><text x="60" y="746" fill="#e2e8f0" font-size="9" text-anchor="start" font-weight="400">Dependency pin: 161067f5a21703b3e257024bcb64e565fd9657b4</text><text x="60" y="767" fill="#94a3b8" font-size="9" text-anchor="start" font-weight="400">cellule-types is transitive. Canopy supplies its own signed HTTPS peer transport.</text><text x="280.0" y="865" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Framework capabilities</text><text x="280.0" y="885" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Cellule includes SQL, KV, Queue, Workflow, Blob, Cron, Timer and Effects.</text><text x="280.0" y="900" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Capabilities use typed APIs and explicit topology.</text><text x="820.0" y="865" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Canopy capability boundary</text><text x="820.0" y="885" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Canopy registers SQL Cells today. Multi-capability Repository Cells, repository</text><text x="820.0" y="900" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">queues and autonomous workflows remain a proposal.</text><circle cx="39" cy="977" r="4" fill="#34d399"/><text x="51" y="980" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">domain declarations</text><circle cx="176.2" cy="977" r="4" fill="#60a5fa"/><text x="188.2" y="980" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">framework binding</text><circle cx="303.79999999999995" cy="977" r="4" fill="#fb923c"/><text x="315.79999999999995" y="980" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">fenced execution</text><circle cx="426.59999999999997" cy="977" r="4" fill="#fbbf24"/><text x="438.59999999999997" y="980" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">capabilities not wired into Canopy</text><text x="30" y="33" font-size="16" font-weight="700" fill="#f8fafc">How Canopy models its domain on Cellule</text><text x="30" y="56" font-size="9" fill="#94a3b8">Domain code supplies schema and policy; the embedded framework supplies identity, execution and recovery.</text><text x="1070" y="33" font-size="8" text-anchor="end" fill="#fbbf24">CURRENT SERVING PATH</text>
</svg>
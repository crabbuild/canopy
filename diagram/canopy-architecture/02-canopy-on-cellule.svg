<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1020" role="img" aria-labelledby="title desc">
<title id="title">How Canopy models its domain on Cellule</title><desc id="desc">CanopyApplication registers DirectoryModule and RepositoryModule as SQL Cell types. Directory uses a fixed shard; repository UUIDs derive entity partitions. Product wrappers hold typed SqlCell handles. Cellule owns execution and persistence mechanics, and Canopy owns protocols and authorization. Other framework primitives are available but are not composed into Canopy Repository Cells.</desc>

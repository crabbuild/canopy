<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1220" role="img" aria-labelledby="title desc">
<title id="title">Packed storage evolution and remaining integration</title><desc id="desc">The current product still uses per-object SQL authority, with an active archived-pack optimization. The new subsystem moves canonical inventories, graph metadata, ref snapshots and exact outcomes into verified immutable artifacts and short Cell publication commands. Preparation, publication dispatch, certificates, policy pages, recovery records and readers exist, but the full serving path is not registered and the hard cutover remains incomplete. Multi-capability repository Cells are a separate proposal.</desc>

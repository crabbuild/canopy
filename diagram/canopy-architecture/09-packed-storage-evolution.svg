<rect x="35" y="95" width="1030" height="185" rx="12" fill="none" stroke="#34d399" stroke-dasharray="8 4"/><text x="51" y="115" fill="#34d399" font-size="9" text-anchor="start" font-weight="600">ACTIVE SERVING MODEL</text><rect x="35" y="330" width="1030" height="475" rx="12" fill="none" stroke="#60a5fa" stroke-dasharray="8 4"/><text x="51" y="350" fill="#60a5fa" font-size="9" text-anchor="start" font-weight="600">NEW PACKED CATALOG MODEL / IMPLEMENTED BUILDING BLOCKS</text><path d="M 350,435 L 390,435" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><path d="M 700,435 L 740,435" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/><path d="M 890,490 L 890,540 L 545,540 L 545,590" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/><path d="M 700,648 L 740,648" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><rect x="60" y="140" width="440" height="95" rx="7" fill="#0f172a"/><rect x="60" y="140" width="440" height="95" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="570" y="140" width="470" height="95" rx="7" fill="#0f172a"/><rect x="570" y="140" width="470" height="95" rx="7" fill="#064e3b" fill-opacity=".4" stroke="#34d399" stroke-width="1.4"/><rect x="60" y="380" width="290" height="110" rx="7" fill="#0f172a"/><rect x="60" y="380" width="290" height="110" rx="7" fill="#1e293b" fill-opacity=".4" stroke="#94a3b8" stroke-width="1.4"/><rect x="390" y="380" width="310" height="110" rx="7" fill="#0f172a"/><rect x="390" y="380" width="310" height="110" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="740" y="380" width="300" height="110" rx="7" fill="#0f172a"/><rect x="740" y="380" width="300" height="110" rx="7" fill="#7c2d12" fill-opacity=".4" stroke="#fb923c" stroke-width="1.4"/><rect x="390" y="590" width="310" height="115" rx="7" fill="#0f172a"/><rect x="390" y="590" width="310" height="115" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><rect x="740" y="590" width="300" height="115" rx="7" fill="#0f172a"/><rect x="740" y="590" width="300" height="115" rx="7" fill="#4c1d95" fill-opacity=".4" stroke="#a78bfa" stroke-width="1.4"/><rect x="35" y="855" width="490" height="130" rx="7" fill="#0f172a"/><rect x="35" y="855" width="490" height="130" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><rect x="575" y="855" width="490" height="130" rx="7" fill="#0f172a"/><rect x="575" y="855" width="490" height="130" rx="7" fill="#78350f" fill-opacity=".4" stroke="#fbbf24" stroke-width="1.4"/><rect x="35" y="1035" width="1030" height="90" rx="7" fill="#0f172a"/><rect x="35" y="1035" width="1030" height="90" rx="7" fill="#1e3a8a" fill-opacity=".4" stroke="#60a5fa" stroke-width="1.4"/><text x="280.0" y="165" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Per-object SQL authority</text><text x="280.0" y="185" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Canonical objects + edges + closure in Repository Cell</text><text x="280.0" y="200" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Inline / chunks / external / archived packed blobs</text><text x="280.0" y="215" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">CompletePush publishes refs and stored response</text><text x="805.0" y="165" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Current gateway preparation</text><text x="805.0" y="185" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Serialized native push phase within each gateway</text><text x="805.0" y="200" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Verified immutable body / archive uploads</text><text x="805.0" y="215" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">SQL ingestion batches and graph certification</text><text x="205.0" y="405" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Private native preparation</text><text x="205.0" y="425" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Retain exact input + native result</text><text x="205.0" y="440" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Owned staging / preparation attempts</text><text x="205.0" y="455" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Pack + index + metadata artifacts</text><text x="205.0" y="470" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Verify canonical identity and closure</text><text x="545.0" y="405" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Immutable catalog metadata</text><text x="545.0" y="425" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Sorted directory runs + leveled index</text><text x="545.0" y="440" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Source roots identify physical packs</text><text x="545.0" y="455" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Catalog binds directory + sources</text><text x="545.0" y="470" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Immutable ref-state / outcome roots</text><text x="890.0" y="405" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Publication coordinator</text><text x="890.0" y="425" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Bounded class / account dispatch</text><text x="890.0" y="440" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Register exact SDK command identity</text><text x="890.0" y="455" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Bind owner fence / attempt / base</text><text x="890.0" y="470" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Trusted certificates + ref policy pages</text><text x="545.0" y="615" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Short Cell publication</text><text x="545.0" y="635" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Check current ACL / policy / generation</text><text x="545.0" y="650" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Publish catalog + ref root + outcome</text><text x="545.0" y="665" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Retain generation / recovery facts</text><text x="545.0" y="680" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Cellule still supplies durability gate</text><text x="890.0" y="615" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Pinned catalog readers</text><text x="890.0" y="635" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Verify catalog / source descriptors</text><text x="890.0" y="650" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Resolve OID -&gt; pack location</text><text x="890.0" y="665" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Independent bounded reader facilities</text><text x="890.0" y="680" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Do not infer access from pack membership</text><text x="720.0" y="639.0" fill="#a78bfa" font-size="8" text-anchor="middle" font-weight="400">certified root</text><text x="60" y="758" fill="#fbbf24" font-size="9" text-anchor="start" font-weight="400">packs/publication/mod.rs explicitly says these commands are not registered on the legacy repository serving path.</text><text x="280.0" y="880" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Required production work</text><text x="280.0" y="900" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Wire startup, HTTP, SSH and generated producers/readers; select the fresh schema;</text><text x="280.0" y="915" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">complete recovery, collection, backup and capacity qualification.</text><text x="820.0" y="880" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">Separate Cell capability proposal</text><text x="820.0" y="900" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Adding KV, Queue, Workflow, Blob, Cron, Timer and Effects to the same Repository Cell</text><text x="820.0" y="915" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">needs framework composition and autonomous-progress acceptance gates.</text><text x="550.0" y="1060" fill="#f1f5f9" font-size="12" text-anchor="middle" font-weight="600">What does not change in the intended design</text><text x="550.0" y="1080" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">The repository UUID, one fenced authoritative publisher, final policy checks and durable outcome acknowledgement remain. Immutable uploaded artifacts are preparation until an authorized</text><text x="550.0" y="1095" fill="#b4c1d3" font-size="9" text-anchor="middle" font-weight="400">Cell command publishes them.</text><circle cx="39" cy="1177" r="4" fill="#34d399"/><text x="51" y="1180" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">active serving path</text><circle cx="176.2" cy="1177" r="4" fill="#60a5fa"/><text x="188.2" y="1180" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">new implemented primitives</text><circle cx="347.0" cy="1177" r="4" fill="#a78bfa"/><text x="359.0" y="1180" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">immutable metadata / bytes</text><circle cx="517.8" cy="1177" r="4" fill="#fbbf24"/><text x="529.8" y="1180" fill="#94a3b8" font-size="8" text-anchor="start" font-weight="400">integration and qualification open</text><text x="30" y="33" font-size="16" font-weight="700" fill="#f8fafc">Packed storage evolution and remaining integration</text><text x="30" y="56" font-size="9" fill="#94a3b8">These primitives exist in code; the replacement production request path and fresh-schema cutover remain open.</text><text x="1070" y="33" font-size="8" text-anchor="end" fill="#fbbf24">INCOMPLETE PRODUCT INTEGRATION</text>
</svg>